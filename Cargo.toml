[package]
name = "sentry-kubernetes"
version = "2.0.0-beta.1"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5.23", features = ["derive"] }
config = { version = "0.15", features = ["json", "yaml", "toml"] }
futures = "0.3"
lazy_static = "1.4"
libz-sys = { version = "1.1", features = ["static"] }
log = "0.4"
nom = "7"
nom-regex = "0.2"
kube = { version = "0.97", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.23.0", features = ["v1_26"] }
mini-moka = "0.10.3"
serde_json = "1.0"
simple_logger = "5.0"
tokio = { version = "1.25", features = ["rt", "macros", "rt-multi-thread"] }
tokio-graceful-shutdown = "0.15"
serde = { version = "1.0.216", features = ["derive"] }

[dependencies.sentry]
version = "0.35"
default-features = false
features = [
    "anyhow",
    "backtrace",
    "contexts",
    "debug-images",
    "debug-logs",
    "log",
    "panic",
    "reqwest",
    "rustls",
]
